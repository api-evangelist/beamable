apis:
- aid: beamable:game-economy
  name: Beamable Game Economy API
  description: >
    REST API for virtual currency, inventory, and in-game store management. Provides endpoints for granting,
    spending, and querying player currencies, managing item inventories, configuring store catalogs, and
    handling real- money purchase workflows with custom reporting. Integrates with the LiveOps portal
    for non-engineer management of economy content.
