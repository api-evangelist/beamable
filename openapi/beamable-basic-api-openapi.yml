components:
  schemas:
    DataPoint:
      type: object
      additionalProperties: false
      properties:
        timestamp:
          type: string
        value:
          type: string
      required:
      - timestamp
      - value
    InFlightFailure:
      type: object
      additionalProperties: false
      properties:
        serviceObjectId:
          type: string
        timestamp:
          type: integer
          format: int64
        serviceName:
          type: string
        inFlightMessage:
          $ref: '#/components/schemas/InFlightMessage'
        lastError:
          type: string
        id:
          type: string
      required:
      - id
      - serviceObjectId
      - serviceName
      - inFlightMessage
      - lastError
      - timestamp
    CreatePlanRequest:
      properties:
        name:
          type: string
        messageBusAnalytics:
          type: array
          items:
            type: string
        mongoSrvAddress:
          type: string
        memcachedHosts:
          type: string
        mongoSSL:
          type: boolean
        platformJBDC:
          type: string
        sharded:
          type: boolean
        mongoHosts:
          type: string
        messageBusCommon:
          type: array
          items:
            type: string
        redisShards:
          type: array
          items:
            $ref: '#/components/schemas/RedisShardRequest'
      additionalProperties: false
      title: Create Plan Request
      type: object
      required:
      - name
      - mongoHosts
      - sharded
      - mongoSSL
      - platformJBDC
      - memcachedHosts
      - redisShards
    UpdateGameHierarchyRequest:
      properties:
        rootPID:
          type: string
          x-beamable-semantic-type: Pid
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectView'
      additionalProperties: false
      title: Update Game Hierarchy Request
      type: object
      required:
      - rootPID
      - projects
    ManifestChecksums:
      properties:
        manifests:
          type: array
          items:
            $ref: '#/components/schemas/ManifestChecksum'
      additionalProperties: false
      title: Manifest Checksums
      type: object
      required:
      - manifests
    CustomerViewResponse:
      properties:
        customer:
          $ref: '#/components/schemas/CustomerView'
      additionalProperties: false
      title: Customer View Response
      type: object
      required:
      - customer
    GetLambdaURI:
      properties:
        uri:
          type: string
      additionalProperties: false
      title: Get Lambda URI
      type: object
      required:
      - uri
    PASlowQuery:
      type: object
      additionalProperties: false
      properties:
        line:
          type: string
        namespace:
          type: string
      required:
      - line
      - namespace
    LaunchMessageListResponse:
      properties:
        files:
          type: array
          items:
            type: string
      additionalProperties: false
      title: Launch Message List Response
      type: object
      required:
      - files
    MicroserviceRegistrationRequest:
      properties:
        serviceName:
          type: string
